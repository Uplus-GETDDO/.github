<rect x="56" y="926" width="1488" height="76" rx="10" fill="#e8f8f1"/>
<text x="76" y="959" font-size="22" fill="#0b6549" font-weight="600">내부에서 뽑은 결과와 사용자에게 공개한 명단을 나눕니다. 명단을 바꾼 뒤에도 이전에 어떤 결과를 보여 줬는지 확인할 수 있습니다.</text>
<text x="56" y="1054" font-size="17" fill="#52616b" font-weight="400">기준: 초기 DBML(97ed4841) → 2026-10-16 설계(25754f8) · 핵심 컬럼·제약만 발췌</text>
<text x="56" y="1082" font-size="16" fill="#52616b" font-weight="400">PK: 고유 번호 · UNIQUE: 같은 값의 중복 저장 방지 · CHECK: 저장할 값의 조건</text>
