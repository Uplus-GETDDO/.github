<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1102" viewBox="0 0 1600 1102" role="img" aria-labelledby="title desc">
<title id="title">추첨 공개: 현재 명단 → 공개했던 명단까지 보존 — 테이블 변경 전·후</title>
<desc id="desc">내부에서 뽑은 결과와 사용자에게 공개한 명단을 나눕니다. 명단을 바꾼 뒤에도 이전에 어떤 결과를 보여 줬는지 확인할 수 있습니다. 초기 DBML 97ed4841과 2026-10-16 설계 25754f8의 핵심 컬럼·제약을 발췌한 비교입니다.</desc>
<metadata>before: https://github.com/Uplus-GETDDO/getddo-be/blob/97ed4841/docs/03-database/schema.dbml ; after: https://github.com/Uplus-GETDDO/getddo-be/blob/25754f8eeb7f33365311f3da319664e1f7faa8a5/docs/03-database/schema.dbml</metadata>
