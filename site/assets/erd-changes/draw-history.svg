<title id="title">추첨 운영: 최근 실패 상태 → 실패·검사 과정 기록 — 테이블 변경 전·후</title>
<desc id="desc">실패와 검사를 별도 기록으로 나눴습니다. 같은 추첨에서 어떤 오류가 반복됐는지, 누가 무엇을 확인했는지 남길 수 있습니다. 초기 DBML 97ed4841과 2026-10-16 설계 25754f8의 핵심 컬럼·제약을 발췌한 비교입니다.</desc>
