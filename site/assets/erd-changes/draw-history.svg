<text x="76" y="1219" font-size="22" fill="#0b6549" font-weight="600">실패와 검사를 별도 기록으로 나눴습니다. 같은 추첨에서 어떤 오류가 반복됐는지, 누가 무엇을 확인했는지 남길 수 있습니다.</text>
<text x="56" y="1314" font-size="17" fill="#52616b" font-weight="400">기준: 초기 DBML(97ed4841) → 2026-10-16 설계(25754f8) · 핵심 컬럼·제약만 발췌</text>
<text x="56" y="1342" font-size="16" fill="#52616b" font-weight="400">PK: 고유 번호 · UNIQUE: 같은 값의 중복 저장 방지 · CHECK: 저장할 값의 조건</text>
