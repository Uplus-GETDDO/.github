<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1226" viewBox="0 0 1600 1226" role="img" aria-labelledby="title desc">
<title id="title">응모권: 남은 수량 → 한 장의 상태와 이력 — 테이블 변경 전·후</title>
<desc id="desc">합계만 보던 구조에서 응모권 한 장씩 확인하는 구조로 바꿨습니다. 어느 등급을 언제 받거나 썼는지 따라갈 수 있습니다. 초기 DBML 97ed4841과 2026-10-16 설계 25754f8의 핵심 컬럼·제약을 발췌한 비교입니다.</desc>
