<rect x="56" y="1050" width="1488" height="76" rx="10" fill="#e8f8f1"/>
<text x="76" y="1083" font-size="22" fill="#0b6549" font-weight="600">합계만 보던 구조에서 응모권 한 장씩 확인하는 구조로 바꿨습니다. 어느 등급을 언제 받거나 썼는지 따라갈 수 있습니다.</text>
<text x="56" y="1178" font-size="17" fill="#52616b" font-weight="400">기준: 초기 DBML(97ed4841) → 2026-10-16 설계(25754f8) · 핵심 컬럼·제약만 발췌</text>
<text x="56" y="1206" font-size="16" fill="#52616b" font-weight="400">PK: 고유 번호 · UNIQUE: 같은 값의 중복 저장 방지 · CHECK: 저장할 값의 조건</text>
