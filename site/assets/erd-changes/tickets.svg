<rect width="1600" height="1226" fill="#f7fafb"/>
<text x="56" y="62" font-size="35" fill="#26313a" font-weight="750">응모권: 남은 수량 → 한 장의 상태와 이력</text>
<text x="56" y="103" font-size="19" fill="#52616b" font-weight="400">빨강: 제거·교체되는 항목    초록: 추가·보강한 항목    나머지: 비교에 필요한 주요 필드</text>
<text x="56" y="160" font-size="28" fill="#a43d37" font-weight="750">변경 전 · 초기 설계</text>
<text x="852" y="160" font-size="28" fill="#087658" font-weight="750">변경 후 · 2026-10-16 설계</text>
<text x="778" y="165" font-size="32" fill="#52616b" font-weight="750">→</text>
