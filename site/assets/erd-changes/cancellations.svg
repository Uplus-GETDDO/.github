"76" y="544" font-size="17" fill="#52616b" font-weight="400">UNIQUE (draw_result_id)</text><text x="76" y="574" font-size="17" fill="#52616b" font-weight="400">UNIQUE (replacement_draw_id)</text>
<text x="62" y="642" font-size="19" fill="#52616b" font-weight="400">한 당첨 결과의 취소는 한 건</text>
