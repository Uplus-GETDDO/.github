<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="906" viewBox="0 0 1600 906" role="img" aria-labelledby="title desc">
<title id="title">당첨 취소: 취소 대상 확인 + 같은 요청도 구분 — 테이블 변경 전·후</title>
<desc id="desc">기존에도 한 당첨 결과의 중복 취소를 막았습니다. 요청 키를 더해 같은 요청의 재전송을 구별하고 기존 취소·재추첨 연결을 재사용합니다. 초기 DBML 97ed4841과 2026-10-16 설계 25754f8의 핵심 컬럼·제약을 발췌한 비교입니다.</desc>
