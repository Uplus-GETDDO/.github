<text x="858" y="676" font-size="19" fill="#52616b" font-weight="400">기존 취소 대상 제약 유지 + 같은 요청 번호도 한 건</text>
<rect x="56" y="730" width="1488" height="76" rx="10" fill="#e8f8f1"/>
<text x="76" y="763" font-size="22" fill="#0b6549" font-weight="600">기존에도 한 당첨 결과의 중복 취소를 막았습니다. 요청 키를 더해 같은 요청의 재전송을 구별하고 기존 취소·재추첨 연결을 재사용합니다.</text>
<text x="56" y="858" font-size="17" fill="#52616b" font-weight="400">기준: 초기 DBML(97ed4841) → 2026-10-16 설계(25754f8) · 핵심 컬럼·제약만 발췌</text>
<text x="56" y="886" font-size="16" fill="#52616b" font-weight="400">PK: 고유 번호 · UNIQUE: 같은 값의 중복 저장 방지 · CHECK: 저장할 값의 조건</text>
</svg>