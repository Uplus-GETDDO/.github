<rect x="56" y="892" width="1488" height="76" rx="10" fill="#e8f8f1"/>
<text x="76" y="925" font-size="22" fill="#0b6549" font-weight="600">재추첨마다 응모자 상세를 복사하지 않고 최초 정보를 사용합니다. 실행별로 누가 참여했는지는 연결 테이블에 따로 남깁니다.</text>
<text x="56" y="1020" font-size="17" fill="#52616b" font-weight="400">기준: 초기 DBML(97ed4841) → 2026-10-16 설계(25754f8) · 핵심 컬럼·제약만 발췌</text>
<text x="56" y="1048" font-size="16" fill="#52616b" font-weight="400">PK: 고유 번호 · UNIQUE: 같은 값의 중복 저장 방지 · CHECK: 저장할 값의 조건</text>
