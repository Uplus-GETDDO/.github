f0ef"/><text x="76" y="494" font-size="14" fill="#576b7a" font-weight="700"></text><text x="115" y="494" font-size="20" fill="#a43d37" font-weight="700">validation_data</text><text x="613" y="494" font-size="15" fill="#60717d" font-weight="400">json</text><text x="76" y="528" font-size="14" fill="#576b7a" font-weight="700"></text><text x="115" y="528" font-size="20" fill="#26313a" font-weight="400">score</text><text x="613" y="528" font-size="15" fill="#60717d" font-weight="400">bigint</text>
