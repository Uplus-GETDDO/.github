<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="910" viewBox="0 0 1600 910" role="img" aria-labelledby="title desc">
<title id="title">게임: 시작했을 때의 기준을 함께 보관 — 테이블 변경 전·후</title>
<desc id="desc">시작할 때의 규칙과 문제 생성 기준을 따로 저장합니다. 설정이 바뀌어도 그 판을 시작했을 때의 기준으로 점수를 확인합니다. 초기 DBML 97ed4841과 2026-10-16 설계 25754f8의 핵심 컬럼·제약을 발췌한 비교입니다.</desc>
<metadata>before: https://github.com/Uplus-GETDDO/getddo-be/blob/97ed4841/docs/03-database/schema.dbml ; after: https://github.com/Uplus-GETDDO/getddo-be/blob/25754f8eeb7f33365311f3da319664e1f7faa8a5/docs/03-database/schema.dbml</metadata>
