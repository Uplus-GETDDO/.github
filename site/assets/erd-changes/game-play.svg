 y="472" width="690" height="33" fill="#e8f8f1"/><text x="872" y="494" font-size="14" fill="#576b7a" font-weight="700"></text><text x="911" y="494" font-size="20" fill="#087658" font-weight="700">generator_version</text><text x="1409" y="494" font-size="15" fill="#60717d" font-weight="400">varchar(50)</text><rect x="853" y="506" width="690" height="33" fill="#e8f8f1"/><text x="872" y="528" font-size="14" fill="#576b7a" font-weight="700"></text><text x="911" y="528" font-size="20" fill="#087658" font-weight="700">generation_seed</text><text x="1409" y="528" font-size="15" fill="#60717d" font-weight="400">bigint</text><text x="872" y="562" font-size="14" fill="#576b7a" font-weight="700"></text><text x="911" y="562" font-size="20" fill="#26313a" font-weight="400">score</text><text x="1409" y="562" font-size="15" fill="#60717d" font-weight="400">bigint</text><text x="872" y="596" font-size="14" fill="#576b7a" font-weight="700"></text><text x="911" y="596" font-size="20" fill="#26313a" font-weight="400">completed_at</text><text x="1409" y="596" font-size="15" fill="#60717d" font-weight="400">datetime(6)</text>
<text x="858" y="680" font-size="19" fill="#52616b" font-weight="400">rules_snapshot: 규칙 / generation_seed: 문제 생성값</text>
<rect x="56" y="734" width="1488" height="76" rx="10" fill="#e8f8f1"/>
<text x="76" y="767" font-size="22" fill="#0b6549" font-weight="600">시작할 때의 규칙과 문제 생성 기준을 따로 저장합니다. 설정이 바뀌어도 그 판을 시작했을 때의 기준으로 점수를 확인합니다.</text>
<text x="56" y="862" font-size="17" fill="#52616b" font-weight="400">기준: 초기 DBML(97ed4841) → 2026-10-16 설계(25754f8) · 핵심 컬럼·제약만 발췌</text>
<text x="56" y="890" font-size="16" fill="#52616b" font-weight="400">PK: 고유 번호 · UNIQUE: 같은 값의 중복 저장 방지 · CHECK: 저장할 값의 조건</text>
