<text x="76" y="1129" font-size="22" fill="#0b6549" font-weight="600">할 일과 실제 알림을 나눈 구조는 유지합니다. 복구를 시작한 번호를 추가해 예전 처리의 늦은 결과와 새 처리를 구분합니다.</text>
<text x="56" y="1224" font-size="17" fill="#52616b" font-weight="400">기준: 초기 DBML(97ed4841) → 2026-10-16 설계(25754f8) · 핵심 컬럼·제약만 발췌</text>
<text x="56" y="1252" font-size="16" fill="#52616b" font-weight="400">PK: 고유 번호 · UNIQUE: 같은 값의 중복 저장 방지 · CHECK: 저장할 값의 조건</text>
