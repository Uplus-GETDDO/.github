<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1272" viewBox="0 0 1600 1272" role="img" aria-labelledby="title desc">
<title id="title">알림: 누적 횟수와 다시 처리하는 구간 구분 — 테이블 변경 전·후</title>
<desc id="desc">할 일과 실제 알림을 나눈 구조는 유지합니다. 복구를 시작한 번호를 추가해 예전 처리의 늦은 결과와 새 처리를 구분합니다. 초기 DBML 97ed4841과 2026-10-16 설계 25754f8의 핵심 컬럼·제약을 발췌한 비교입니다.</desc>
<metadata>before: https://github.com/Uplus-GETDDO/getddo-be/blob/97ed4841/docs/03-database/schema.dbml ; after: https://github.com/Uplus-GETDDO/getddo-be/blob/25754f8eeb7f33365311f3da319664e1f7faa8a5/docs/03-database/schema.dbml</metadata>
