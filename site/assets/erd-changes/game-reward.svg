<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="966" viewBox="0 0 1600 966" role="img" aria-labelledby="title desc">
<title id="title">게임 보상: 같은 판·같은 날의 중복 지급 차단 — 테이블 변경 전·후</title>
<desc id="desc">기존 식별 키는 유지하고 플레이 1회·사용자별 게임의 하루 1회 기준을 추가했습니다. 결과를 다시 보내도 같은 보상을 두 번 주지 않습니다. 초기 DBML 97ed4841과 2026-10-16 설계 25754f8의 핵심 컬럼·제약을 발췌한 비교입니다.</desc>
<metadata>before: https://github.com/Uplus-GETDDO/getddo-be/blob/97ed4841/docs/03-database/schema.dbml ; after: https://github.com/Uplus-GETDDO/getddo-be/blob/25754f8eeb7f33365311f3da319664e1f7faa8a5/docs/03-database/schema.dbml</metadata>
<style>@font-face{font-family:Pretendard;src:url(../PretendardVariable.woff2)}text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}</style>
<rect width="1600" height="966" fill="#f7fafb"/>
<text x="56" y="62" font-size="35" fill="#26313a" font-weight="750">게임 보상: 같은 판·같은 날의 중복 지급 차단</text>
<text x="56" y="103" font-size="19" fill="#52616b" font-weight="400">빨강: 제거·교체되는 항목    초록: 추가·보강한 항목    나머지: 비교에 필요한 주요 필드</text>
<text x="56" y="160" font-size="28" fill="#a43d37" font-weight="750">변경 전 · 초기 설계</text>
<text x="852" y="160" font-size="28" fill="#087658" font-weight="750">변경 후 · 2026-10-16 설계</text>
<text x="778" y="165" font-size="32" fill="#52616b" font-weight="750">→</text>
<rect x="56" y="206" width="692" height="406" rx="10" fill="white" stroke="#ced8de"/><path d="M66 206H738Q748 206 748 216V272H56V216Q56 206 66 206" fill="#edf2f5"/><text x="76" y="235" font-size="24" fill="#26313a" font-weight="700">game_reward_claims</text><text x="76" y="259" font-size="16" fill="#52616b" font-weight="400">보상 식별 키로 중복 구분</text><text x="76" y="290" font-size="14" fill="#576b7a" font-weight="700">PK</text><text x="115" y="290" font-size="20" fill="#26313a" font-weight="400">id</text><text x="613" y="290" font-size="15" fill="#60717d" font-weight="400">binary(16)</text><text x="76" y="324" font-size="14" fill="#576b7a" font-weight="700"></text><text x="115" y="324" font-size="20" fill="#26313a" font-weight="400">user_id</text><text x="613" y="324" font-size="15" fill="#60717d" font-weight="400">binary(16)</text><text x="76" y="358" font-size="14" fill="#576b7a" font-weight="700"></text><text x="115" y="358" font-size="20" fill="#26313a" font-weight="400">game_id</text><text x="613" y="358" font-size="15" fill="#60717d" font-weight="400">binary(16)</text><text x="76" y="392" font-size="14" fill="#576b7a" font-weight="700"></text><text x="115" y="392" font-size="20" fill="#26313a" font-weight="400">game_play_id</text><text x="613" y="392" font-size="15" fill="#60717d" font-weight="400">binary(16)</text><text x="76" y="426" font-size="14" fill="#576b7a" font-weight="700"></text><text x="115" y="426" font-size="20" fill="#26313a" font-weight="400">reward_date</text><text x="613" y="426" font-size="15" fill="#60717d" font-weight="400">date</text><text x="76" y="460" font-size="14" fill="#576b7a" font-weight="700"></text><text x="115" y="460" font-size="20" fill="#26313a" font-weight="400">source_key</text><text x="613" y="460" font-size="15" fill="#60717d" font-weight="400">varchar(160)</text><text x="76" y="494" font-size="14" fill="#576b7a" font-weight="700"></text><text x="115" y="494" font-size="20" fill="#26313a" font-weight="400">ticket_count</text><text x="613" y="494" font-size="15" fill="#60717d" font-weight="400">int</text><text x="76" y="548" font-size="16" fill="#52616b" font-weight="700">중복·값 검사</text><text x="76" y="578" font-size="17" fill="#52616b" font-weight="400">UNIQUE (user_id, source_key)</text>
<text x="62" y="646" font-size="19" fill="#52616b" font-weight="400">사용자 + 보상 식별 키로 중복 방지</text>
