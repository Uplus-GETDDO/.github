y="494" font-size="14" fill="#576b7a" font-weight="700"></text><text x="911" y="494" font-size="20" fill="#26313a" font-weight="400">ticket_count</text><text x="1409" y="494" font-size="15" fill="#60717d" font-weight="400">int</text><text x="872" y="548" font-size="16" fill="#52616b" font-weight="700">중복·값 검사</text><text x="872" y="578" font-size="17" fill="#087658" font-weight="400">유지: UNIQUE (user_id, source_key)</text><text x="872" y="608" font-size="17" fill="#087658" font-weight="400">추가: UNIQUE (game_play_id)</text><text x="872" y="638" font-size="17" fill="#087658" font-weight="400">추가: UNIQUE (user_id, game_id, reward_date)</text><text x="872" y="668" font-size="17" fill="#087658" font-weight="400">보강: CHECK (ticket_count = 1)</text>
<text x="858" y="736" font-size="19" fill="#52616b" font-weight="400">같은 플레이 1회 / 같은 사용자·게임·KST 날짜 1회</text>
<rect x="56" y="790" width="1488" height="76" rx="10" fill="#e8f8f1"/>
<text x="76" y="823" font-size="22" fill="#0b6549" font-weight="600">기존 식별 키는 유지하고 플레이 1회·사용자별 게임의 하루 1회 기준을 추가했습니다. 결과를 다시 보내도 같은 보상을 두 번 주지 않습니다.</text>
<text x="56" y="918" font-size="17" fill="#52616b" font-weight="400">기준: 초기 DBML(97ed4841) → 2026-10-16 설계(25754f8) · 핵심 컬럼·제약만 발췌</text>
<text x="56" y="946" font-size="16" fill="#52616b" font-weight="400">PK: 고유 번호 · UNIQUE: 같은 값의 중복 저장 방지 · CHECK: 저장할 값의 조건</text>
</svg>