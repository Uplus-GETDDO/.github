<text x="1308" y="124" font-size="18" font-weight="700" fill="#00805d">05</text>
<text x="1308" y="160" font-size="26" font-weight="700" fill="#20262e">응모 접수·차감</text>
<text x="1308" y="198" font-size="20" font-weight="400" fill="#596778">등급별 사용할 장수 선택</text>
