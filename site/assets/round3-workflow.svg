<rect x="30" y="95" width="280" height="160" rx="16" fill="#e8faf3" stroke="#9cd9c5" stroke-width="2"/>
<text x="48" y="124" font-size="18" font-weight="700" fill="#00805d">01</text>
<text x="48" y="160" font-size="26" font-weight="700" fill="#20262e">출석·미션·게임</text>
<text x="48" y="198" font-size="20" font-weight="400" fill="#596778">일일·연속 출석</text>
<text x="48" y="226" font-size="20" font-weight="400" fill="#596778">퀴즈·설문·게임 참여</text>
<rect x="345" y="95" width="280" height="160" rx="16" fill="#f5f7f8" stroke="#dce4e1" stroke-width="2"/>
<text x="363" y="124" font-size="18" font-weight="700" fill="#00805d">02</text>
<text x="363" y="160" font-size="26" font-weight="700" fill="#20262e">보상 조건 확인</text>
<text x="363" y="198" font-size="20" font-weight="400" fill="#596778">출석·미션 달성 확인</text>
<text x="363" y="226" font-size="20" font-weight="400" fill="#596778">게임: 서버 판정·최소 점수</text>
<rect x="660" y="95" width="280" height="160" rx="16" fill="#e8faf3" stroke="#9cd9c5" stroke-width="2"/>
<text x="678" y="124" font-size="18" font-weight="700" fill="#00805d">03</text>
<text x="678" y="160" font-size="26" font-weight="700" fill="#20262e">등급 응모권 지급</text>
<text x="678" y="198" font-size="20" font-weight="400" fill="#596778">출석: 브론즈 고정</text>
<text x="678" y="226" font-size="20" font-weight="400" fill="#596778">미션·게임: 무작위 등급 1장</text>
