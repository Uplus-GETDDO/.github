<text x="1308" y="531" font-size="20" font-weight="400" fill="#596778">후보·가중치·결과 보존</text>
<rect x="975" y="400" width="280" height="160" rx="16" fill="#e8faf3" stroke="#9cd9c5" stroke-width="2"/>
<text x="993" y="429" font-size="18" font-weight="700" fill="#00805d">07</text>
<text x="993" y="465" font-size="26" font-weight="700" fill="#20262e">관리자 검토·공개</text>
<text x="993" y="503" font-size="20" font-weight="400" fill="#596778">명단 검토·취소·재추첨</text>
<text x="993" y="531" font-size="20" font-weight="400" fill="#596778">발표 요청 한 번으로 공개</text>
<rect x="660" y="400" width="280" height="160" rx="16" fill="#fff4d2" stroke="#e6c666" stroke-width="2"/>
<text x="678" y="429" font-size="18" font-weight="700" fill="#00805d">08</text>
<text x="678" y="465" font-size="26" font-weight="700" fill="#20262e">결과·알림 확인</text>
<text x="678" y="503" font-size="20" font-weight="400" fill="#596778">공개 명단·본인 당첨 결과</text>
<text x="678" y="531" font-size="20" font-weight="400" fill="#596778">결과 발표와 알림 확인</text>
<rect x="30" y="400" width="280" height="160" rx="16" fill="#fff4d2" stroke="#e6c666" stroke-width="2"/>
<text x="48" y="429" font-size="18" font-weight="700" fill="#00805d">CANCEL</text>
<text x="48" y="465" font-size="26" font-weight="700" fill="#20262e">이벤트 취소</text>
<text x="48" y="503" font-size="20" font-weight="400" fill="#596778">관리자 취소 처리</text>
<text x="48" y="531" font-size="20" font-weight="400" fill="#596778">취소·반환 함께 확정</text>
<rect x="345" y="400" width="280" height="160" rx="16" fill="#fff4d2" stroke="#e6c666" stroke-width="2"/>
<text x="363" y="429" font-size="18" font-weight="700" fill="#00805d">REFUND</text>
<text x="363" y="465" font-size="26" font-weight="700" fill="#20262e">응모권 반환·알림</text>
<text x="363" y="503" font-size="20" font-weight="400" fill="#596778">차감했던 응모권 반환</text>
<text x="363" y="531" font-size="20" font-weight="400" fill="#596778">기존 등급 유지·취소 알림</text>
<rect x="30" y="594" width="1540" height="60" rx="12" fill="#f5f7f8"/>
<text x="50" y="620" font-size="20" font-weight="400" fill="#596778">응모권 미사용 이벤트는 차감 없이 접수합니다. 자동 추첨과 관리자 수동 공개는 구분합니다.</text>
<text x="50" y="646" font-size="20" font-weight="400" fill="#596778">이벤트 취소 시 차감한 응모권을 반환하며, 취소된 이벤트의 이후 응모·추첨·최초 공개는 차단합니다.</text>
