<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc"><title id="title">GETDDO 전체 서비스 워크플로우</title><desc id="desc">출석·미션·게임, 보상 조건 확인, 등급 응모권 지급, 이벤트 조회·선택, 응모 접수·차감, 마감 5분 후 자동 추첨, 관리자 검토·수동 공개, 결과·알림 확인. 운영 중 이벤트 취소 시 차감 응모권 반환과 취소 알림으로 분기한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#00805d"/></marker><marker id="cancel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b07914"/></marker></defs><rect width="1600" height="680" fill="#fff"/><g font-family="Pretendard,Arial,sans-serif">
<text x="30" y="46" font-size="24" font-weight="700" fill="#00805d">사용자 · 활동 · 응모</text>
