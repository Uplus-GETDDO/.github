<path d="M1430 255V400" fill="none" stroke="#00805d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1450" y="331" font-size="20" font-weight="700" fill="#00805d">모집 마감</text>
<path d="M1290 480H1255" fill="none" stroke="#00805d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M975 480H940" fill="none" stroke="#00805d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
