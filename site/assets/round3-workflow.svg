<text x="993" y="124" font-size="18" font-weight="700" fill="#00805d">04</text>
<text x="993" y="160" font-size="26" font-weight="700" fill="#20262e">이벤트 조회·선택</text>
<text x="993" y="198" font-size="20" font-weight="400" fill="#596778">경품·멤버십·기간 확인</text>
<text x="993" y="226" font-size="20" font-weight="400" fill="#596778">응모권 사용·미사용 선택</text>
