<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title description">
  <title id="title">GETDDO 사용자 이용 흐름</title>
  <desc id="description">홈에서 바로 이벤트를 선택하거나, 출석·미션·게임 중 원하는 활동으로 응모권을 먼저 모은다. 이벤트 상세에서 경품·기간·참여 조건을 확인하고 응모한다. 응모권이 부족하면 다시 모으고, 응모권 미사용 이벤트는 응모권 없이 참여한다. 응모 후 내 응모 내역에서 발표를 기다리며, 결과 발표 후 알림함 또는 이벤트에서 당첨 여부와 경품을 확인한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#00805d"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b07914"/></marker>
  </defs>
  <style>
    text { font-family:Pretendard, 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif; fill:#20262e; }
    .title { font-size:30px; font-weight:750; }
    .body { font-size:23px; fill:#596778; }
    .label { font-size:22px; font-weight:650; fill:#00805d; }
    .number { font-size:18px; font-weight:700; letter-spacing:2px; fill:#00805d; }
    .center { text-anchor:middle; }
    .route { fill:none; stroke:#00805d; stroke-width:3; stroke-linejoin:round; marker-end:url(#arrow); }
    .return { fill:none; stroke:#b07914; stroke-width:2.5; stroke-dasharray:8 6; stroke-linejoin:round; marker-end:url(#back); }
  </style>
  <rect width="1600" height="680" fill="#fff"/>

  <!-- Home offers a direct event path or an optional reward activity. -->
  <path class="route" d="M115 360V157H260"/>
  <text class="label" x="30" y="120">먼저 응모권 모으기</text>
  <rect x="260" y="38" width="520" height="236" rx="18" fill="#e8faf3" stroke="#9cd9c5" stroke-width="2"/>
  <text class="title" x="286" y="84">응모권 모으기</text>
  <text class="body" x="286" y="120">출석 브론즈 · 미션/게임 등급 보상</text>
  <rect x="286" y="141" width="142" height="66" rx="12" fill="#fff"/>
  <text class="title center" x="357" y="183">출석</text>
  <rect x="449" y="141" width="142" height="66" rx="12" fill="#fff"/>
  <text class="title center" x="520" y="183">미션</text>
  <rect x="612" y="141" width="142" height="66" rx="12" fill="#fff"/>
  <text class="title center" x="683" y="183">게임</text>
  <text class="label center" x="520" y="246">등급 응모권 획득 · 보유량 확인</text>
  <path class="route" d="M380 274V360"/>

  <!-- Read the main path from left to right: every card is a user step. -->
  <path class="route" d="M210 430H275"/>
  <path class="route" d="M485 430H550"/>
  <path class="route" d="M760 430H825"/>
  <path class="route" d="M1025 430H1090"/>
  <path class="route" d="M1300 430H1370"/>
  <text class="label center" x="244" y="337">바로 이벤트 선택</text>
  <text class="label center" x="1335" y="337">결과 발표 후</text>

  <rect x="20" y="360" width="190" height="142" rx="16" fill="#e8faf3" stroke="#9cd9c5" stroke-width="2"/>
  <text class="number" x="42" y="392">START</text>
  <text class="title" x="42" y="430">홈</text>
  <text class="body" x="42" y="462">서비스</text>
  <text class="body" x="42" y="490">둘러보기</text>

  <rect x="275" y="360" width="210" height="142" rx="16" fill="#f5f7f8" stroke="#dce4e1" stroke-width="2"/>
  <text class="number" x="297" y="392">01</text>
  <text class="title" x="297" y="430">이벤트 선택</text>
  <text class="body" x="297" y="462">관심 있는 경품</text>
  <text class="body" x="297" y="490">찾아보기</text>

  <rect x="550" y="360" width="210" height="142" rx="16" fill="#f5f7f8" stroke="#dce4e1" stroke-width="2"/>
  <text class="number" x="572" y="392">02</text>
  <text class="title" x="572" y="430">상세 확인</text>
  <text class="body" x="572" y="462">경품·참여 조건</text>
  <text class="body" x="572" y="490">기간·등급별 장수</text>

  <rect x="825" y="360" width="200" height="142" rx="16" fill="#e8faf3" stroke="#1fbe8e" stroke-width="2"/>
  <text class="number" x="847" y="392">03</text>
  <text class="title" x="847" y="430">응모하기</text>
  <text class="body" x="847" y="469">등급별 장수 선택</text>

  <rect x="1090" y="360" width="210" height="142" rx="16" fill="#f5f7f8" stroke="#dce4e1" stroke-width="2"/>
  <text class="number" x="1112" y="392">04</text>
  <text class="title" x="1112" y="430">내 응모 내역</text>
  <text class="body" x="1112" y="462">응모 내역 확인</text>
  <text class="body" x="1112" y="490">결과 발표 대기</text>

  <rect x="1370" y="360" width="210" height="142" rx="16" fill="#fff4d2" stroke="#e6c666" stroke-width="2"/>
  <text class="number" x="1392" y="392">05</text>
  <text class="title" x="1392" y="430">당첨 결과</text>
  <text class="body" x="1392" y="462">당첨 여부·경품</text>
  <text class="body" x="1392" y="490">알림함 / 이벤트</text>

  <path class="return" d="M925 360V307H740V274"/>
  <text class="body" x="813" y="285" style="fill:#986914">부족하면 응모권 모으기</text>

  <rect x="20" y="550" width="1560" height="89" rx="14" fill="#f5f7f8"/>
  <text class="label" x="44" y="586">응모권을 꼭 모아야 하는 것은 아닙니다.</text>
  <text class="body" x="44" y="619">응모권 미사용 이벤트는 응모권 없이 참여 · 이미 충분히 보유했다면 바로 이벤트 선택 · 참여 조건은 이벤트 상세에서 확인</text>
</svg>
