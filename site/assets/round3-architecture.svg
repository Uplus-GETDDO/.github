<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-label="GETDDO 시스템 아키텍처: 현재 문서 기준 구성과 후속 구성"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#536678"/></marker></defs><rect width="1440" height="540" fill="#fff"/><g font-family="Pretendard,Arial,sans-serif"><text x="20" y="28" font-size="18" font-weight="700" fill="#e6007e">APPLICATION · 사용자 / 관리자</text><rect x="20" y="55" width="230" height="115" rx="14" fill="#e8faf3" stroke="#cbded7"/><text x="38" y="87" font-size="22" font-weight="700" fill="#203241">브라우저</text><text x="38" y="116" font-size="18" font-weight="400" fill="#203241">사용자 화면 · 관리자 화면</text><text x="38" y="141" font-size="18" font-weight="400" fill="#203241">가상 사용자 기반 시연</text><rect x="300" y="55" width="270" height="115" rx="14" fill="#e8faf3" stroke="#cbded7"/><text x="318" y="87" font-size="22" font-weight="700" fill="#203241">Vercel · Frontend</text><text x="318" y="116" font-size="18" font-weight="400" fill="#203241">React · TypeScript · Vite</text><text x="318" y="141" font-size="18" font-weight="400" fill="#203241">API 요청 · 서버 상태 관리</text><path d="M250 110 H300" fill="none" stroke="#536678" stroke-width="2" marker-end="url(#arrow)"/><text x="252" y="96" font-size="16" font-weight="400" fill="#536678">HTTPS</text><rect x="650" y="55" width="370" height="200" rx="14" fill="#e8faf3" stroke="#cbded7"/><text x="668" y="87" font-size="22" font-weight="700" fill="#203241">EC2 · Docker / Spring Boot</text><text x="668" y="116" font-size="18" font-weight="400" fill="#203241">api → core / storage:db</text><text x="668" y="141" font-size="18" font-weight="400" fill="#203241">Controller · Service · Repository</text><text x="668" y="166" font-size="18" font-weight="400" fill="#203241">출석 · 미션 · 게임 · 응모권</text><text x="668" y="191" font-size="18" font-weight="400" fill="#203241">응모 · 추첨 · 공개 · 알림</text><path d="M570 110 H650" fill="none" stroke="#536678" stroke-width="2" marker-end="url(#arrow)"/><text x="588" y="96" font-size="16" font-weight="400" fill="#536678">API</text><rect x="1100" y="55" width="320" height="115" rx="14" fill="#e8faf3" stroke="#cbded7"/><text x="1118" y="87" font-size="22" font-weight="700" fill="#203241">RDS · MySQL 8.4</text><text x="1118" y="116" font-size="18" font-weight="400" fill="#203241">비공개 데이터베이스</text><text x="1118" y="141" font-size="18" font-weight="400" fill="#203241">응모권 · 응모 · 추첨 기록</text><path d="M1020 110 H1100" fill="none" stroke="#536678" stroke-width="2" marker-end="url(#arrow)"/><text x="1045" y="96" font-size="16" font-weight="400" fill="#536678">TLS</text><text x="1100" y="211" font-size="20" font-weight="700" fill="#203241">DB 트랜잭션 + 유일 제약</text><text x="1100" y="239" font-size="18" font-weight="400" fill="#203241">응모·차감·이력의 일관성</text><rect x="20" y="205" width="550" height="100" rx="14" fill="#f3f5f8" stroke="#cbded7"/><text x="38" y="237" font-size="22" font-weight="700" fill="#203241">GitHub Actions · CI / CD</text><text x="38" y="266" font-size="18" font-weight="400" fill="#203241">테스트·빌드 → Docker 이미지 → S3 → SSM</text><path d="M570 255 H650 V220" fill="none" stroke="#536678" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="244" font-size="16" font-weight="400" fill="#536678">배포</text><text x="20" y="345" font-size="18" font-weight="700" fill="#a46312">FOLLOW-UP · 구성 준비 / 적용·연동 검증 필요</text><rect x="20" y="370" width="440" height="105" rx="14" fill="#fff5df" stroke="#cbded7"/><text x="38" y="402" font-size="22" font-weight="700" fill="#203241">HTTPS 진입 경로</text><text x="38" y="431" font-size="18" font-weight="400" fill="#203241">CloudFront → 비공개 ALB → EC2</text><text x="38" y="456" font-size="18" font-weight="400" fill="#203241">기본 HTTPS 주소 · API 캐시 비활성화</text><rect x="500" y="370" width="440" height="105" rx="14" fill="#fff5df" stroke="#cbded7"/><text x="518" y="402" font-size="22" font-weight="700" fill="#203241">Redis · 이미지 저장</text><text x="518" y="431" font-size="18" font-weight="400" fill="#203241">Redis / ElastiCache · S3 이미지 저장</text><text x="518" y="456" font-size="18" font-weight="400" fill="#203241">적용 범위 및 서비스 연동 검증 필요</text><rect x="980" y="370" width="440" height="105" rx="14" fill="#fff5df" stroke="#cbded7"/><text x="998" y="402" font-size="22" font-weight="700" fill="#203241">확장 · 운영 검증</text><text x="998" y="431" font-size="18" font-weight="400" fill="#203241">EC2 2대 운영 · 순차 배포는 후속 계획</text><text x="998" y="456" font-size="18" font-weight="400" fill="#203241">워커 중복 실행 · 실패 복구 검증</text><text x="20" y="519" font-size="18" font-weight="400" fill="#536678">현재 배포 기록: EC2 1대 + RDS · HTTP 운영자 제한 환경. HTTPS 프론트와 직접 API 연동은 후속 검증 대상.</text></g></svg>